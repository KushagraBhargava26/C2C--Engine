spring.application.name=backend
server.port=8080
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
python.service.baseurl=${PYTHON_SERVICE_BASEURL:http://localhost:8000}

newsapi.key=${NEWSAPI_KEY:1a52a07063ad4d0fb34be4126f372cf7}

# JWT signing secret — MUST be overridden via the JWT_SECRET env var in Render.
# Needs to be at least 32 characters (HS256 requires a 256-bit key).
jwt.secret=${JWT_SECRET:dev-only-change-me-this-is-not-a-real-secret-32chars}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Google Sign-In OAuth Client ID (from Google Cloud Console).
# Needed to verify the ID token Google's Sign-In button hands back.
google.client-id=${GOOGLE_CLIENT_ID:}